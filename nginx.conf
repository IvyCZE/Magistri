server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    proxy_read_timeout 65s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Service worker and PWA manifest - never cache so updates take effect immediately
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Icons keep their file names, so they are revalidated instead of cached for a year
    location ~* ^/(favicon\.ico|favicon\.svg|icon\.svg|apple-touch-icon\.png|icon-[a-z0-9-]+\.png)$ {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # All API routes use the same checked, DNS-pinned HTTPS proxy as Vite.
    # Same-origin requests only; never expose upstream cookies or wildcard CORS.
    location ^~ /api-sluzby/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy-security.conf;
    }

    location ^~ /api-proxy/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy-security.conf;
    }

    location ^~ /api-school/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy-security.conf;
        proxy_read_timeout 125s;
    }

    # Standalone policy page at an extensionless URL (never the SPA fallback).
    location = /privacypolicy {
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files /privacypolicy.html =404;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
